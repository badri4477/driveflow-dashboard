name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: node --check every source file
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build   # tsc -b && vite build

  deploy:
    name: Deploy to production (EC2)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/deploy.sh on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          # Pull first so the server always runs the latest deploy.sh.
          # The app lives in root's home (pm2 runs as root), so run it via sudo;
          # falls back to the login user's home if the app is there instead.
          script: |
            set -e
            if [ -d "$HOME/driveflow-dashboard/.git" ]; then
              cd "$HOME/driveflow-dashboard"
              git pull --ff-only origin main
              bash scripts/deploy.sh
            elif sudo test -d /root/driveflow-dashboard/.git; then
              sudo -i bash -c 'cd /root/driveflow-dashboard && git pull --ff-only origin main && bash scripts/deploy.sh'
            else
              echo "driveflow-dashboard not found in $HOME or /root"; exit 1
            fi
